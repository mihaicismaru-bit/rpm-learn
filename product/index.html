<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>RPM LEARN — Functional Product TEST</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f4f6f8}
*{box-sizing:border-box} body{margin:0}.shell{max-width:720px;margin:0 auto;min-height:100vh;background:#fff;padding:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:900}.badge{padding:6px 9px;border:1px solid #d0d5dd;border-radius:999px;font-size:.75rem;font-weight:800}
nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.tab{padding:11px;border:1px solid #cfd6df;background:#fff;border-radius:12px;font-weight:700}.tab[aria-selected="true"]{background:#eef4f7;border-color:#7c9bab}
.card{border:1px solid #dfe4ea;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 5px 18px rgba(15,23,42,.05)}
h1{font-size:1.25rem;margin:0}h2{font-size:1.05rem;margin:0 0 12px}h3{font-size:.95rem;margin:16px 0 8px}
progress{width:100%;height:14px}.meta{display:flex;gap:10px;flex-wrap:wrap;font-size:.85rem;color:#596579}.status{font-weight:800}
button.action{width:100%;padding:13px;margin:6px 0;border:1px solid #bac4cf;border-radius:12px;background:#fff;text-align:left;font-size:1rem}
button.primary{background:#17324d;color:#fff;border-color:#17324d}.picked{min-height:40px;padding:10px;border:1px dashed #aab4bf;border-radius:10px;margin:8px 0}
.notice{padding:12px;border-radius:12px;background:#fff7e8;border:1px solid #f2d49a;font-size:.9rem}.ok{background:#eef9f2;border-color:#b9dfc7}.danger{background:#fff0f1;border-color:#efc2c7}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{padding:12px;border:1px solid #e2e7ed;border-radius:12px}.metric b{display:block;font-size:1.1rem}
.small{font-size:.78rem;color:#697586}.hidden{display:none}.list{display:grid;gap:8px}.row{padding:10px;border:1px solid #e3e7ec;border-radius:10px}
</style>
</head>
<body><main class="shell">
<div class="top"><div><div class="brand">RPM LEARN</div><div class="small">Functional Product Integration</div></div><span class="badge">TEST · NOT PRODUCTION</span></div>
<nav>
<button class="tab" data-role="learner" aria-selected="true">Learner</button>
<button class="tab" data-role="teacher" aria-selected="false">Teacher</button>
<button class="tab" data-role="employer" aria-selected="false">Employer</button>
</nav>
<section id="learnerPanel"></section>
<section id="teacherPanel" class="hidden"></section>
<section id="employerPanel" class="hidden"></section>
<p class="small">Canonical modules: S3 Lesson Player · S4 Speaking/Review · S5 Mastery · S6 Validated Time · S7 Teacher OS · S8 Employer OS · S9 Reports · S11 Certificate Gate. Legal binding and final Romanian production voice remain deferred.</p>
</main><script type="module" src="./app.mjs"></script></body></html>
