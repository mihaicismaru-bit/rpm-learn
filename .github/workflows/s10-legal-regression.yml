name: RPM S10 Legal Simulation Fail-Closed Gate (TEST)
on:
  push:
    branches:
      - s10/legal-configuration-v0.1
  pull_request:
    branches:
      - s9/reports-evidence-pack-v0.1
permissions:
  contents: read
jobs:
  deterministic-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin S2 promoted package and fingerprint
        run: |
          node tools/s2b-package-gate-v2.mjs --source-root canonical/s2b/v2.6 --sums packaging/s2b/v2.6.1/SHA256SUMS.txt --fingerprint canonical/s2b/v2.6/RPM_S2B_BUILD_FINGERPRINT.json
          (cd canonical/s2b/v2.6 && node build-fingerprint-self-check.mjs)
      - name: S2 deterministic role event time content regressions
        run: |
          set -euo pipefail
          cd canonical/s2b/v2.6
          for test in tests.mjs s2-tests.mjs pwa-contract-tests.mjs pwa-dependency-closure-tests.mjs acceptance-contract-tests.mjs browser-acceptance-static-tests.mjs s2-content-contract-tests.mjs s2-identity-scope-tests.mjs s2-role-bound-event-tests.mjs s2-time-integrity-tests.mjs s2-time-attribution-tests.mjs s2-time-source-link-tests.mjs s2-time-idle-retrocredit-tests.mjs s2-audio-lifecycle-integrity-tests.mjs s2-sequence-integrity-tests.mjs s2-sequence-allocation-tests.mjs s2-sequence-chain-quarantine-tests.mjs s2-speaking-review-gate-tests.mjs s2-event-semantic-integrity-tests.mjs s2-event-path-integrity-tests.mjs; do node "$test"; done
      - name: S3 to S10 deterministic fail-closed and locale-regression suites
        run: |
          set -euo pipefail
          for stage in s3 s4 s5 s6 s7 s8 s9 s10; do
            while IFS= read -r -d '' test; do echo "::group::$test"; node "$test"; echo "::endgroup::"; done < <(find "canonical/$stage" -type f -name '*tests.mjs' -print0 | sort -z)
          done
      - name: Deny production and certificate authority
        run: |
          echo 'Simulation-only S10: Legal Blueprint FINAL not approved.'
          echo 'S11 certificate issuance BLOCKED; gh-pages TEST / NOT PRODUCTION.'
